```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirCard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    .button {
      flex: 1;
      height: 100%;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-size: clamp(2rem, 5vw, 5rem);
      font-weight: 700;
      color: white;
      text-decoration: none;
      cursor: pointer;
      transition: filter 0.2s, transform 0.2s;
    }

    .button:hover {
      filter: brightness(1.15);
    }

    .button:active {
      transform: scale(0.98);
    }

    .windows {
      background: #0078d4;
    }

    .macos {
      background: #111111;
    }

    .icon {
      width: clamp(40px, 6vw, 80px);
      height: clamp(40px, 6vw, 80px);
      fill: currentColor;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      .container {
        flex-direction: column;
      }

      .button {
        width: 100%;
        height: 50%;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <a
      class="button windows"
      href="https://github.com/Lumid-Off/AirCard-Windows"
      target="_blank"
      rel="noopener noreferrer"

      </svg>
